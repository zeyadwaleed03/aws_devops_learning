version: '3'
services:
  app1:
    image: myapp:v1.0
    environment:
      - APP_NAME=APP1
    ports:
      - "8081:8080"
  app2:
    image: myapp:v1.0
    environment:
      - APP_NAME=APP2
    ports:
     - "8082:8080"  

  app3:
    image: myapp:v1.0
    environment:
      - APP_NAME=APP3
    ports:
     - "8083:8080"  
  webserver:
    image: nginx:alpine
    ports:
     - "8080:8080"

