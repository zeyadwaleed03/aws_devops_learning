services:
  app1:
    build: .
    image: myapp:v1.0
    restart: unless-stopped
    environment:
      - APP_NAME=APP1
      - PORT=8081
  app2:
    image: myapp:v1.0
    restart: unless-stopped
    environment:
      - APP_NAME=APP2
      - PORT=8082

  app3:
    image: myapp:v1.0
    restart: unless-stopped
    environment:
      - APP_NAME=APP3
      - PORT=8083
  webserver:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /opt/certbot/www:/var/www/certbot
      - /opt/certbot/conf:/etc/letsencrypt
    ports:
     - "8080:8080"
     - "443:443"
     - "80:80"
