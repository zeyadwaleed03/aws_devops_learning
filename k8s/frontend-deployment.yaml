apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: learning
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
          volumeMounts:
            - mountPath: /usr/share/nginx/html/index.html
              name: html
              subPath: index.html
      volumes:
        - name: html
          configMap:
            name: frontend
