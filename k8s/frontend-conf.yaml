apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend
  namespace: learning
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Frontend Demo</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          margin: 40px;
          background: #f0f4f8;
        }
        .card {
          background: white;
          padding: 24px;
          border-radius: 12px;
          max-width: 600px;
          margin: auto;
        }
        h1 { color: #2563eb; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>This is the FRONTEND</h1>
        <p>Served by NGINX inside Kubernetes.</p>
        <p>Application: Frontend Demo</p>
        <p>Status: Running</p>
        <p>Environment: Minikube</p>
      </div>
    </body>
    </html>
