apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: learning
spec:
  selector:
    matchLabels:

     app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
        - name: admin
          image: nginx
          ports:
            - containerPort: 80
          volumeMounts:
            - mountPath: /usr/share/nginx/html/index.html
              name: html
              subPath: index.html
      volumes:
        - name: html
          configMap:
            name: admin
